name: WinForms E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_screenshot:
        description: Capture the sample window after the mouse and keyboard test
        type: boolean
        default: false

permissions:
  contents: read

env:
  E2E_PROJECT: tests/WinFormsSample.E2E/WinFormsSample.E2E.csproj

jobs:
  e2e:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Log runner environment
        shell: pwsh
        run: |
          Write-Host "Runner image: $env:ImageOS $env:ImageVersion"
          Write-Host "Windows version: $([Environment]::OSVersion.VersionString)"
          Write-Host "Shell session ID: $((Get-Process -Id $PID).SessionId)"
          Write-Host "Shell user interactive: $([Environment]::UserInteractive)"
          dotnet --version

      - name: Build .NET Framework 4.8 app and tests
        run: dotnet build $env:E2E_PROJECT -c Release

      - name: Run FlaUI tests
        shell: pwsh
        env:
          E2E_SCREENSHOT_PATH: ${{ inputs.capture_screenshot && format('{0}/winforms-e2e.png', runner.temp) || '' }}
        run: |
          dotnet test $env:E2E_PROJECT -c Release --no-build `
            --logger 'console;verbosity=detailed' `
            --logger 'trx;LogFileName=e2e.trx' `
            --results-directory (Join-Path $env:RUNNER_TEMP 'WinFormsE2E') `
            -- RunConfiguration.TreatNoTestsAsError=true

      - name: Record screenshot in the job log
        if: ${{ inputs.capture_screenshot }}
        shell: pwsh
        run: |
          $screenshotPath = Join-Path $env:RUNNER_TEMP 'winforms-e2e.png'
          $png = [Convert]::ToBase64String([IO.File]::ReadAllBytes($screenshotPath))
          Write-Host "WINFORMS_SCREENSHOT_PNG_BASE64=$png"

      - name: Summarize both test results
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $expectedTests = [ordered]@{
            UiaPatterns_UpdateResult = 'UI Automation (SetValue and Invoke)'
            MouseAndKeyboard_UpdateResult = 'Mouse and keyboard input'
          }
          $trxPath = Join-Path $env:RUNNER_TEMP 'WinFormsE2E/e2e.trx'
          $testResults = @()
          if (Test-Path -LiteralPath $trxPath -PathType Leaf) {
            [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
            $testResults = @($trx.SelectNodes("//*[local-name()='UnitTestResult']"))
          }

          $summary = @(
            '## WinForms E2E on windows-2025'
            ''
            '| Interaction | Outcome |'
            '| --- | --- |'
          )
          $allPassed = $testResults.Count -eq $expectedTests.Count
          foreach ($testName in $expectedTests.Keys) {
            $results = @($testResults | Where-Object { $_.testName -eq $testName })
            $outcome = switch ($results.Count) {
              0 { 'Not run' }
              1 { $results[0].outcome }
              default { 'Duplicate results' }
            }
            $summary += "| $($expectedTests[$testName]) | $outcome |"
            $allPassed = $allPassed -and $outcome -eq 'Passed'
          }
          $summary | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

          if (-not $allPassed) {
            throw 'Expected exactly one passing result for each of the two FlaUI tests.'
          }
